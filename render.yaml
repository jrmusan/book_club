databases:
  - name: book-club-db
    databaseName: bookclub
    user: bookclub
    plan: free

services:
  - type: web
    name: book-club-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    buildCommand: ""
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: book-club-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
